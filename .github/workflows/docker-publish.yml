---
name: Build and Publish Remesher Docker Image

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME || 'michaelgold' }}/remesher
  DOCKERFILE: docker-example/runpod/Dockerfile
  CONTEXT: docker-example/runpod
  TEST_CONTAINER: remesher-ci-smoke

jobs:
  build-and-smoke:
    name: Build and smoke test Docker image
    runs-on: self-hosted
    timeout-minutes: 180
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_name: ${{ steps.meta.outputs.image_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          short_sha="${GITHUB_SHA::12}"
          echo "image_tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE_NAME}:sha-${short_sha}"

      - name: Pull existing images for Docker layer cache
        run: |
          docker pull "${IMAGE_NAME}:latest" || true
          docker pull "${IMAGE_NAME}:${{ steps.meta.outputs.image_tag }}" || true
          docker pull michaelgold/comfy3d:latest || true

      - name: Build Docker image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --cache-from "${IMAGE_NAME}:latest" \
            --cache-from "${IMAGE_NAME}:${{ steps.meta.outputs.image_tag }}" \
            --cache-from michaelgold/comfy3d:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t "${IMAGE_NAME}:${{ steps.meta.outputs.image_tag }}" \
            -f "${DOCKERFILE}" "${CONTEXT}"

      - name: Smoke test container startup
        run: |
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::remesher container diagnostics"
              docker ps -a --filter "name=${TEST_CONTAINER}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true
              docker logs --tail 500 "${TEST_CONTAINER}" || true
              nvidia-smi || true
              echo "::endgroup::"
            fi
            docker rm -f "${TEST_CONTAINER}" || true
            exit "$status"
          }
          trap cleanup EXIT

          docker rm -f "${TEST_CONTAINER}" || true
          docker run -d \
            --name "${TEST_CONTAINER}" \
            --runtime=nvidia \
            --gpus all \
            -p 8235:8188 \
            -e DOWNLOAD_MODELS_ON_START=0 \
            -e CLONE_REMESHER_ON_START=0 \
            -e VLM_ENABLE=0 \
            -e HERMES_ENABLE=0 \
            "${IMAGE_NAME}:${{ steps.meta.outputs.image_tag }}"

          for attempt in $(seq 1 90); do
            if docker logs "${TEST_CONTAINER}" 2>&1 | tee logs.txt | grep -q "Starting ComfyUI" && \
               docker logs "${TEST_CONTAINER}" 2>&1 | grep -q "0.0.0.0"; then
              echo "✅ Remesher container started ComfyUI"
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' "${TEST_CONTAINER}" 2>/dev/null | grep -q true; then
              echo "❌ Container exited before startup completed"
              exit 1
            fi
            sleep 5
          done

          docker logs "${TEST_CONTAINER}" > logs.txt 2>&1 || true
          cat logs.txt
          echo "❌ Timed out waiting for ComfyUI startup"
          exit 1

  push:
    name: Push Docker image
    needs: build-and-smoke
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Check Docker Hub credentials are configured
        run: |
          if [ -z "${{ vars.DOCKERHUB_USERNAME }}" ]; then
            echo "Repository variable DOCKERHUB_USERNAME is required." >&2
            exit 1
          fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Repository secret DOCKERHUB_TOKEN is required." >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        run: |
          docker push "${{ needs.build-and-smoke.outputs.image_name }}:${{ needs.build-and-smoke.outputs.image_tag }}"
          docker tag \
            "${{ needs.build-and-smoke.outputs.image_name }}:${{ needs.build-and-smoke.outputs.image_tag }}" \
            "${{ needs.build-and-smoke.outputs.image_name }}:latest"
          docker push "${{ needs.build-and-smoke.outputs.image_name }}:latest"
